# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# AYANEO Pocket EVO: USB HID pad (4001:0428) + gpio-keys-pocket-evo extra buttons.
# Codes measured on the device (evdev):
#   A 304, B 305, X 307 (BTN_X/BTN_NORTH), Y 308 (BTN_Y/BTN_WEST), L1 310, R1 311,
#   L2/R2 digital 312/313 + ABS_BRAKE/ABS_GAS (0..255), Select 314, Start 315, Home 316,
#   L3 317, R3 318, sticks ABS_X/ABS_Y + ABS_Z/ABS_RZ, D-pad ABS_HAT0X/Y.
#   gpio-keys: left inner trigger button KEY_RIGHTSHIFT, right inner trigger button KEY_LEFT,
#   right-side AYANEO button KEY_A, right-side lower button KEY_EQUAL.
version: 2
kind: CapabilityMap
name: AYANEO Pocket EVO Mapping
id: ayaneo_evo

mapping:
  - name: Guide Button (Home)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: Quick Access (AYANEO button)
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_A
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  - name: Right Paddle 2 (lower right-side button)
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_EQUAL
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle2

  - name: Left Paddle 1 (left inner trigger button)
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_RIGHTSHIFT
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  - name: Right Paddle 1 (right inner trigger button)
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_LEFT
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: South Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: South

  - name: East Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_EAST
          value_type: button
    target_event:
      gamepad:
        button: East

  - name: West Button (X)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button (Y)
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: Start Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_START
          value_type: button
    target_event:
      gamepad:
        button: Start

  - name: Select Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SELECT
          value_type: button
    target_event:
      gamepad:
        button: Select

  - name: Left Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TL
          value_type: button
    target_event:
      gamepad:
        button: LeftBumper

  - name: Right Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TR
          value_type: button
    target_event:
      gamepad:
        button: RightBumper

  - name: Left Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_BRAKE
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger

  - name: Right Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_GAS
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger

  - name: Left Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: LeftStick

  - name: Right Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick

  - name: Left Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBL
          value_type: button
    target_event:
      gamepad:
        button: LeftStick

  - name: Right Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBR
          value_type: button
    target_event:
      gamepad:
        button: RightStick

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadRight

  - name: Dpad Up
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadUp

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadDown

filtered_events: []
